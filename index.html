<script>
document.addEventListener("DOMContentLoaded", function() {
    setTimeout(function() {

        // ── Find Leaflet map ───────────────────────────────────────────
        var mapVar = Object.values(window).find(function(v) {
            return v && typeof v === 'object' && v._leaflet_id && v.getCenter;
        });
        if (!mapVar) return;

        var isMobile = mapVar.getContainer().offsetWidth < 600;

        // ── TITLE ──────────────────────────────────────────────────────
        var title = document.createElement('div');
        title.innerHTML = '🌲 Sweet Treets 🌲';
        title.style.cssText = [
            'position: fixed',
            'top: 10px',
            'left: 50%',
            'transform: translateX(-50%)',
            'z-index: 99999',
            'background: rgba(255,255,255,0.92)',
            'border: 1px solid #aaa',
            'border-radius: 10px',
            'box-shadow: 0 2px 8px rgba(0,0,0,0.15)',
            'pointer-events: none',
            'white-space: nowrap',
            isMobile ? 'font-size: 14px; padding: 5px 12px;'
                     : 'font-size: 24px; padding: 8px 20px;'
        ].join(';');
        document.body.appendChild(title);

        // ── BANNER (tree + country counts) ────────────────────────────
        var banner = document.getElementById('stat-banner');
        if (banner) {
            banner.style.fontSize  = isMobile ? '11px' : '16px';
            banner.style.padding   = isMobile ? '6px 10px' : '10px 16px';
            banner.style.gap       = isMobile ? '10px' : '20px';
            banner.style.top       = isMobile ? '48px' : '70px';
        }

        // ── LEGEND ─────────────────────────────────────────────────────
        var legend = document.getElementById('season-legend');
        if (legend) {
            legend.style.fontSize = isMobile ? '11px'  : '16px';
            legend.style.padding  = isMobile ? '6px 8px' : '10px';
            legend.style.bottom   = isMobile ? '20px'  : '50px';
            legend.style.right    = isMobile ? '10px'  : '50px';
        }

        // ── POPUP position ─────────────────────────────────────────────
        mapVar.on('popupopen', function(e) {
            var popup      = e.popup;
            var mapWidth   = mapVar.getContainer().offsetWidth;
            var clickPoint = mapVar.latLngToContainerPoint(popup.getLatLng());
            var targetX    = mapWidth < 600 ? mapWidth / 2 : 220;
            popup.setLatLng(
                mapVar.containerPointToLatLng(window.L.point(targetX, clickPoint.y))
            );
        });

    }, 500);
});
</script>
